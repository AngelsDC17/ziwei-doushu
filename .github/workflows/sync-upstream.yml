name: Sync upstream

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_OWNER: Renhuai123
      UPSTREAM_REPO: ziwei-doushu
      BRANCH: main
      REPO: ${{ github.repository }}
    steps:
      - name: Merge upstream branch
        run: |
          set -eu
          echo "merge $UPSTREAM_OWNER/$UPSTREAM_REPO:$BRANCH -> $REPO"
          if gh api -X POST "repos/$REPO/merge-upstream" -f branch="$BRANCH" --jq '.merge_type'; then
            echo "branch sync ok"
          else
            echo "::warning::merge-upstream failed (conflict or upstream branch removed)"
          fi

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror upstream tags
        run: |
          set -eu
          git remote add upstream "https://github.com/$UPSTREAM_OWNER/$UPSTREAM_REPO.git"
          git fetch upstream --tags --force --prune
          echo "local tags after fetch: $(git tag | wc -l)"
          git push origin --tags --force
